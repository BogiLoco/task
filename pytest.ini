[pytest]
# Repo root importable, so tests can `import framework`.
pythonpath = .
testpaths = tests

# `pytest -m api` / `pytest -m ui` run one layer.
markers =
    api: API-level tests (requests, no browser) — fast and deterministic
    ui: end-to-end UI tests (Selenium + Chrome)
    testcase(id): unique test case id "TC-<scenario>.<case>", e.g. "TC-03.02"; the scenario is in docs/01_test_plan.md

# -ra lists the reason of every xfail (the known bugs) in the summary.
# The report path (reports/<timestamp>/) is set in the root conftest.py.
addopts = -v -ra --self-contained-html

# INFO logs (API calls, UI steps, contract checks) go to the HTML report.
log_level = INFO
log_format = %(asctime)s.%(msecs)03d %(levelname)-5s [%(name)s] %(message)s
log_date_format = %H:%M:%S
